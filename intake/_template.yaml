# 客户 intake 表 —— 生成题库的输入
#
# 用法
#   1. 复制这个文件到仓库外:..\clients\<客户名>.yaml
#      (填好的表含客户名、竞品、禁问话题 = 客户机密,**绝不放进公开仓库**)
#   2. 按下面每一项填写。标了 必填 的缺了会让报告质量下降,不会报错
#   3. 生成题库 -> 交给客户确认 -> 才跑测量
#
# 为什么每个字段后面都写了「改变什么」
#   一个字段如果改变不了任何输出,就是在让客户白填,而摩擦会让表填不完。
#   所以这张表的规则是:**没有作用的字段不许存在**。
#
# 类型说明
#   选项 = 从给定值里选(机器处理,减少填写成本)
#   填空 = 无法枚举,必须客户自己说
#   列表 = 一行一条,或 [a, b, c]

meta:
  client:            # 填空 必填  客户公司名(内部用,不进报告)
  filled_by:         # 填空 必填  谁填的(将来出问题能追溯)
  filled_on:         # 填空 必填  日期 YYYY-MM-DD
  bank_approved_by:  # 填空       谁确认了最终题库 —— 报告第一节会写这个名字

# ─────────────────────────────────────────────────────────────
# A. 品牌与实体 —— 决定「事实题」的措辞,以及实体歧义诊断
# ─────────────────────────────────────────────────────────────
brand:
  name:              # 填空 必填  品牌全称(工商/注册名)
  short_name:        # 填空 必填  口语简称 —— 客户平时怎么叫自己
  former_names: []   # 列表       曾用名(今天暴露的实体问题就在这一项)
  english_name:      # 填空       英文名,做海外市场时必填
  aliases: []        # 列表 必填  其他叫法、俗称、错写 —— 用来判断 AI 有没有认出你
  website:           # 填空       没有官网就留空(报告会走"纯可见度"那条路)
  domain:            # 填空       用于检查回答有没有引用你自己的页面
  official_profiles: # 列表       官方社媒/百科/工商登记页 URL —— 实体一致性的对照基线
  founded_year:      # 填空       事实题会核这个

# ─────────────────────────────────────────────────────────────
# B. 行业与品类 —— 决定「品类题」的措辞。用客户的行话,不要用我们造的词
# ─────────────────────────────────────────────────────────────
industry:
  # ⚠️ 这里**不是**行业分类表。世界上有几万个细分,任何表都不全,而且分类表本身不产生价值。
  #    行业细分是**客户的输入**,不是我们的数据 —— 它只作为文字填进问法骨架的槽位。
  #    所以:下面 subcategory / category_terms 用自由文本,不用枚举。
  sector:            # 选项 选填  仅作路由提示(合规追问的力度、来源先验),**不是分类依据**
                     #            金融 | 餐饮 | 制造 | 医疗 | 教育 | 零售 | 软件 | 专业服务 | 文旅 | 物流 | 其他
  subcategory:       # 填空 必填  具体子品类,**用客户自己的话**(例如"跨境收款"而不是"金融科技")
  category_terms: [] # 列表 必填  **确认后的品类词 —— 唯一权威**,生成器只读这一项
  jargon: []         # 列表       行业黑话与俗称 —— 覆盖用户真实问法

  # 术语采集工作区:步骤 ① 官网抽取 → ② LLM 提议 → ③ 客户勾选
  # 只有勾选后的词才抄进上面的 category_terms;这个区块是过程记录,不是结论。
  term_candidates:
    from_website: [] # ① 自动抽取:客户官网/落地页里他们**自己的原话**
    llm_proposed: [] # ② LLM 提议的候选词(15–30 个)—— **提议,不是定稿**
    confirmed_by:    # ③ 谁勾选的 —— 报告第一节会写这个名字


# ─────────────────────────────────────────────────────────────
# C. 客群与场景 —— 决定「场景题」。这一块价值最高,因为答案在客户的销售团队手里
# ─────────────────────────────────────────────────────────────
audience:
  type:              # 选项 必填  B2C | B2B | 两者都有
  description:       # 填空 必填  目标客户是谁(行业、规模、角色)
  situations: []     # 列表 必填  客户在什么处境下需要你
  most_asked: []     # 列表 必填  **客户最常问的 3 个问题** —— 直接来自真实对话,比模板准
  answered_badly: [] # 列表 必填  **销售时最常被问到、但答不好的问题** —— 做这个产品的理由
  concerns: []       # 列表       购买时的顾虑(价格/合规/迁移成本…)

# ─────────────────────────────────────────────────────────────
# D. 竞品 —— 决定「对比题」
# ─────────────────────────────────────────────────────────────
competitors:
  names: []          # 列表 必填  3–5 个真实竞品名
  desired_peers: []  # 列表       客户希望被并列的公司(报告里会特别看这一组)
  never_mention: []  # 列表       不要在问题里出现的名字(避免报告提到客户不想提的人)

# ─────────────────────────────────────────────────────────────
# D2. 合规 —— 判断依据是"有没有监管限制",不是"属于哪个行业"
#     按行业猜会漏掉很多(食品广告法、教育宣传口径都不是"金融/医疗"能覆盖的)
# ─────────────────────────────────────────────────────────────
compliance:
  sensitive:         # 选项 必填  是 | 否 —— 是则生成器会主动追问下面的红线并在报告里标注
  restrictions: []   # 列表       具体的红线:在诉案件、未发布产品、监管处罚记录、功效宣称、比价…
                     #            **这一栏空着而 sensitive=是,不建议开跑**
  claim_rules:       # 填空       行业对宣传口径的硬性限制(能说什么、不能说什么)

# ─────────────────────────────────────────────────────────────
# E. 市场与地域 —— 决定"在哪里问"。⚠️ 这是成本乘数:3 个地区 = 3 倍调用
# ─────────────────────────────────────────────────────────────
markets:
  countries: []      # 列表 必填  主要市场国家
  cities: []         # 列表       如果只在特定城市做生意
  languages: []      # 列表 必填  问题用什么语言问(中文/英文/…)
  cross_border:      # 选项 必填  是 | 否 —— 是则加"海外买家视角"的题

# ─────────────────────────────────────────────────────────────
# F. 期望与边界
# ─────────────────────────────────────────────────────────────
goals:
  primary:           # 选项 必填  触达(没人知道我) | 准确度(说错了) | 竞品对比 | 来源分布 | 全部
  detail:            # 填空       这次最想搞清楚什么(决定选题优先级)
  forbidden_topics: [] # 列表 必填 **禁止提问的话题** —— 合规、在诉、未发布产品。不问迟早出事
  retest_frequency:  # 选项       每月 | 每季 | 单次 —— 写进报告的复测计划

# ─────────────────────────────────────────────────────────────
# G. 现有素材 —— 决定「来源地图」的对照基线(你现在出现在哪几个来源上)
# ─────────────────────────────────────────────────────────────
assets:
  key_pages: []      # 列表       官网主要落地页(技术扫描的对象)
  existing_media: [] # 列表       已有的媒体报道 URL —— 来源对照
  directories: []    # 列表       已收录的行业目录页
  wiki_entries: []   # 列表       百科条目
