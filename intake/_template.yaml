# 客户 intake 表 —— 生成题库的输入
#
# 用法
#   1. 复制这个文件到仓库外:..\clients\<客户名>.yaml
#      (填好的表含客户名、竞品、禁问话题 = 客户机密,**绝不放进公开仓库**)
#   2. 按下面每一项填写。每栏都标了「建议条数」和「空着的后果」
#   3. 生成题库 -> 交给客户确认 -> 才跑测量
#
# 为什么每个字段后面都写了「改变什么」
#   一个字段如果改变不了任何输出,就是在让客户白填,而摩擦会让表填不完。
#   所以这张表的规则是:**没有作用的字段不许存在**。
#
# ⚠️ 「空着的后果」是实测出来的,不是估的(2026-10-08,把本仓库 examples/restaurant.yaml
#    的每个字段分别清空后重跑生成器)。结论分两类,不要混:
#
#   A. 空着会**少题**的,只有三个 —— 它们必须填:
#        brand.name                  空着 ⇒ 事实核验 3/7,总数 25
#        industry.category_terms     空着 ⇒ 品类发现 2/8,总数 23
#        competitors.names           空着 ⇒ 对比选型 4/6,总数 27
#
#   B. 其余字段空着**题数不变**。因为每组的骨架池比目标数大,一个骨架退出,同组别的骨架会补上。
#      所以它们影响的是**覆盖面**(少掉哪一类问题),不是数量。举两个例子:
#        brand.former_names 空着 ⇒ 题数仍 29,但少掉「以前叫 X,是同一家公司吗」那道题
#        audience.situations 空着 ⇒ 题数仍 29,但少掉以「处境」起问的那 5 个骨架(由别的补足数量)
#      **数量够不等于覆盖够。** 这两件事在报告里长得很像,但含义完全不同。
#
#   基准:examples/restaurant.yaml 全填 ⇒ 29 题(8/8/6/7),16 条断言通过。
#
# 类型说明
#   选项 = 从给定值里选(机器处理,减少填写成本)
#   填空 = 无法枚举,必须客户自己说
#   列表 = 一行一条,或 [a, b, c]
#   条数 = 建议条数;少于建议条数通常不影响题数(见上面 B),但会让覆盖变窄

meta:
  client:            # 填空 必填  客户公司名(内部用,不进报告)
  filled_by:         # 填空 必填  谁填的(将来出问题能追溯)。表单代填时写系统名
  filled_on:         # 填空 必填  日期 YYYY-MM-DD。表单代填
  bank_approved_by:  # 填空       谁确认了最终题库 —— 报告第一节会写这个名字

# ─────────────────────────────────────────────────────────────
# A. 品牌与实体 —— 决定「事实题」的措辞,以及实体歧义诊断
# ─────────────────────────────────────────────────────────────
brand:
  name:              # 填空 必填 · 1 条 · ⚠️ 空着 ⇒ 事实核验 3/7、总数 25(实测)。这一栏不能空
  short_name:        # 填空 必填 · 1 条 · 空着 ⇒ 题数不变,少掉「X 指的是哪家公司」那一类
  former_names: []   # 列表        · 1–3 条 · 空着 ⇒ 题数不变,但少掉实体诊断里最有价值的那一道
  english_name:      # 填空        · 1 条 · 做海外市场时必填(英文题库的品牌写法)
  aliases: []        # 列表 必填 · 3–5 条 · 空着 ⇒ 题数不变,少掉「别名/错写」那一道
  products: []       # 列表        · 3–5 条 · 空着 ⇒ 题数不变,少掉「这个东西是谁家的」那一道
  website:           # 填空        · 1 条 · 没有官网就留空(报告会走"纯可见度"那条路)
  domain:            # 填空        · 1 条 · 用于检查回答有没有引用你自己的页面
  official_profiles: # 列表        · 3–6 条 · 不进题库;是实体一致性的对照基线
  founded_year:      # 填空        · 1 条 · **不产出题目**;它是事实组答案的核对基准(verifies)

# ─────────────────────────────────────────────────────────────
# B. 行业与品类 —— 决定「品类题」的措辞。用客户的行话,不要用我们造的词
# ─────────────────────────────────────────────────────────────
industry:
  # ⚠️ 这里**不是**行业分类表。世界上有几万个细分,任何表都不全,而且分类表本身不产生价值。
  #    行业细分是**客户的输入**,不是我们的数据 —— 它只作为文字填进问法骨架的槽位。
  #    所以:下面 subcategory / category_terms 用自由文本,不用枚举。
  sector:            # 选项 选填  仅作路由提示(合规追问的力度、来源先验),**不是分类依据**
                     #            金融 | 餐饮 | 制造 | 医疗 | 教育 | 零售 | 软件 | 专业服务 | 文旅 | 物流 | 其他
  subcategory:       # 填空 必填 · 1 条 · 空着 ⇒ 题数不变,少掉以「细分领域」起问的两道
                     #            具体子品类,**用客户自己的话**(例如"跨境收款"而不是"金融科技")
  category_terms: [] # 列表 必填 · **4–6 条** · ⚠️ 空着 ⇒ 品类发现 2/8、总数 23(实测)
                     #            **确认后的品类词 —— 唯一权威**,生成器只读这一项。
                     #            给 1–2 条题数也不掉(实测),但整组的措辞会退化成同一两个词。
  jargon: []         # 列表        · 3–5 条 · 行业黑话与俗称 —— 覆盖用户真实问法。
                     #            空着 ⇒ 题数不变,少掉以黑话起问的那一道

  # 术语采集工作区:步骤 ① 官网抽取 → ② LLM 提议 → ③ 客户勾选
  # 只有勾选后的词才抄进上面的 category_terms;这个区块是过程记录,不是结论。
  # ⚠️ 生成器**不读**这一块(assertSourcesAreAllowed 会拒绝未来某个骨架开始读它)。
  term_candidates:
    from_website: [] # ① 自动抽取:客户官网/落地页里他们**自己的原话**
    llm_proposed: [] # ② LLM 提议的候选词(15–30 个)—— **提议,不是定稿**
    confirmed_by:    # ③ 谁勾选的 —— 报告第一节会写这个名字


# ─────────────────────────────────────────────────────────────
# C. 客群与场景 —— 决定「场景题」。这一块价值最高,因为答案在客户的销售团队手里
# ─────────────────────────────────────────────────────────────
audience:
  type:              # 选项 必填  B2C | B2B | 两者都有(封闭枚举,填别的值生成器直接报错)
  description:       # 填空 必填 · 1 条 · 空着 ⇒ 题数不变,少掉以客群起问的几道
  situations: []     # 列表 必填 · **4–6 条** · 客户在什么处境下需要你。
                     #            空着 ⇒ 题数不变,但少掉以「处境」起问的 5 个骨架 ——
                     #            那正是这个产品最想测的东西(推荐会不会从"需要"推出来)
  most_asked: []     # 列表 必填 · 3 条 · **客户最常问的 3 个问题** —— 直接来自真实对话,比模板准
  answered_badly: [] # 列表 必填 · 2–3 条 · **销售时最常被问到、但答不好的问题** —— 做这个产品的理由
  concerns: []       # 列表        · 3–5 条 · 购买时的顾虑(价格/合规/迁移成本…)

# ─────────────────────────────────────────────────────────────
# D. 竞品 —— 决定「对比题」
# ─────────────────────────────────────────────────────────────
competitors:
  names: []          # 列表 必填 · **3–5 条** · ⚠️ 空着 ⇒ 对比选型 4/6、总数 27(实测)
                     #            3–5 个真实竞品名;少于 3 条题数也不掉,但那一组会反复问同一家
  desired_peers: []  # 列表        · 2–3 条 · 客户希望被并列的公司(报告里会特别看这一组)。
                     #            空着 ⇒ 题数不变,少掉「你处在什么位置」那两道
  never_mention: []  # 列表        · 0–3 条 · 不要在问题里出现的名字(避免报告提到客户不想提的人)
                     #            **硬校验**:命中任何题目则生成器报错停下,由填表人决定去掉哪一边

# ─────────────────────────────────────────────────────────────
# D2. 合规 —— 判断依据是"有没有监管限制",不是"属于哪个行业"
#     按行业猜会漏掉很多(食品广告法、教育宣传口径都不是"金融/医疗"能覆盖的)
# ─────────────────────────────────────────────────────────────
compliance:
  sensitive:         # 选项 必填  是 | 否 —— 是则生成器会主动追问下面的红线并在报告里标注
  restrictions: []   # 列表        · 1–5 条 · 具体的红线:在诉案件、未发布产品、监管处罚记录、功效宣称、比价…
                     #            **这一栏空着而 sensitive=是,不建议开跑**
  claim_rules:       # 填空        · 1 条 · 行业对宣传口径的硬性限制(能说什么、不能说什么)

# ─────────────────────────────────────────────────────────────
# E. 市场与地域 —— 决定"在哪里问"。⚠️ 这是成本乘数:3 个地区 = 3 倍调用
# ─────────────────────────────────────────────────────────────
markets:
  countries: []      # 列表 必填 · 1–3 条 · 空着(且 cities 也空)⇒ 题数不变,少掉带地域的那几道
  cities: []         # 列表        · 1–3 条 · 如果只在特定城市做生意。**越具体的问题越有意义**
  languages: []      # 列表 必填 · 1–2 条 · 问题用什么语言问(中文/英文/…)
                     #            每多一种语言 = 多一整套题 = 调用量翻倍。客户在哪门语言里写了词,哪门语言才有题
  cross_border:      # 选项 必填  是 | 否 —— 是则加"海外买家视角"的题

# ─────────────────────────────────────────────────────────────
# F. 期望与边界
# ─────────────────────────────────────────────────────────────
goals:
  primary:           # 选项 必填  触达(没人知道我) | 准确度(说错了) | 竞品对比 | 来源分布 | 全部
  detail:            # 填空       这次最想搞清楚什么(决定选题优先级)
  forbidden_topics: [] # 列表 必填 · 1–5 条 · **禁止提问的话题** —— 合规、在诉、未发布产品。不问迟早出事
  retest_frequency:  # 选项       每月 | 每季 | 单次 —— 写进报告的复测计划

# ─────────────────────────────────────────────────────────────
# G. 现有素材 —— 决定「来源地图」的对照基线(你现在出现在哪几个来源上)
#     填得越全,报告里"客户是否已存在于该来源"那一列越像行动清单,而不是一张分布图
# ─────────────────────────────────────────────────────────────
assets:
  key_pages: []      # 列表        · 2–5 条 · 官网主要落地页(技术扫描的对象)
  existing_media: [] # 列表        · 0–10 条 · 已有的媒体报道 URL —— 来源对照
  directories: []    # 列表        · 0–10 条 · 已收录的行业目录页
  wiki_entries: []   # 列表        · 0–5 条 · 百科条目
