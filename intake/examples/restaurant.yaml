# 合成示例（不是真实客户）：川味火锅连锁。
# 存在的理由有两个：让 scripts/report/build-question-bank.mts 可以被测试，
# 以及用一份填好的表说明 intake 应该填到什么程度。这里的公司、竞品、人名、域名全部是编的。
#
# 与 finance.yaml 成对使用：两份表的行业词不重叠，所以生成出来的题库必须明显不同。
# 这里的 never_mention（老灶门）故意是一个「没出现在任何别处」的名字：规则是
# 「never_mention 里的名字不得出现在任何一条问题里」，如果它同时又是竞品名或品类词，
# 生成器会直接报错停下来，由填表的人决定去掉哪一边，而不是替客户默默删掉一个竞品。

meta:
  client: 灶香里餐饮管理有限公司
  filled_by: 示例 · 餐饮线
  filled_on: 2026-10-07
  bank_approved_by:

