    - 灶香里招牌毛肚
    - 灶香里预制小面

industry:
  sector: 餐饮
  subcategory: 川味火锅连锁门店
  category_terms:
    - 川味火锅
    - 直营火锅连锁
    - 成都火锅门店
    - 火锅加盟品牌
  jargon:
    - 翻台率
    - 锅底成本率
    - 中央厨房
    - 堂食占比
  term_candidates:
    from_website:
      - 牛油锅底
      - 直营门店
      - 加盟支持
    # 提议里的这两个词客户没有勾选：它们不应该出现在题库里。
    llm_proposed:
      - 中式餐饮生态
      - 供应链数智化
      - 城市美食名片
    confirmed_by: 示例 · 餐饮线

audience:
  type: 两者都有
  description: 商场招商负责人、想加盟火锅品牌的个体投资人，以及城市里 25-40 岁的聚餐客群
  situations:
    - 商场餐饮层有空铺，要找一个客流稳定的火锅品牌填进去
    - 手里有铺面但不知道选哪个火锅品牌
    - 门店同商圈突然开了三家同类火锅
    - 想给现有门店加一条外卖和预制菜线
  most_asked:
    - 加盟费和回本周期大概是多少？
    - 你们在哪些城市有直营店？
    - 中央厨房配送覆盖到哪里？
  answered_badly:
    - 商场里火锅店的翻台率一般是多少？
    - 加盟商的盈亏比例是多少？
    - 锅底是自产还是代工？
  concerns:
    - 加盟之后总部管不管运营
    - 食安事故怎么追责
    - 同商圈保护范围有多大
    - 前期投入能不能分期

competitors:
  names:
    - 蜀山红火锅
    - 巷子口老火锅
    - 鼎沸里
    - 巴渝码头火锅
  desired_peers:
    - 云顶捞火锅
    - 山城往事火锅
  # 老灶门：客户不想在任何问题里被提到的名字，它不在 names 里，也不在任何别的字段里。
  never_mention:
    - 老灶门

compliance:
