name: verify

# WHAT THIS RUNS, AND WHY EVERY STEP IS HERE
#
# The site's claim is that its published method and its executed method cannot
# drift apart. Four of these steps exist to make that claim mechanical rather than
# aspirational, and the last one is the reason the rest can be trusted:
#
#   check:values     every static URL and contact address agrees with lib/site.ts.
#                    Added after a stale host survived in robots.txt and llms.txt,
#                    where a wrong Sitemap: line is worse than no line at all. It
#                    has since caught two hardcoded origins in new files, one of
#                    them inside an explanatory comment - which is correct, because
#                    a grep cannot tell a comment from working code.
#   test:analyze     the scoring engine's own suite: the robots.txt parser, the
#                    measurement guards, the page-type exemptions, the generated
#                    check copy, the meta ranges the site publishes, and the
#                    assertion that the fixtures exercise every catalogued check.
#   test:rate-limit  the token bucket. Exists because its memory guard used to be
#                    buckets.clear(), which reset every client - the flood that
#                    tripped the guard was also what disarmed it.
#   tsc              types. Cheap, and it catches the class of mistake a build can
#                    silently tolerate.
#   build            proves the pages prerender, which is not the same as compiling.
#   check:built      scores the HTML the build just wrote with the scanner's OWN
#                    analyser and fails if any indexable route is below its floor.
#
# THAT LAST STEP IS THE POINT OF THIS FILE. The scanner only analyses a homepage,
# so it can never see this class of problem on its own site - and twice it did not:
# /llms-txt-studio/ and /readiness-badge/ both shipped two words of prerendered
# HTML while every other check stayed green, because a client component calling
# useSearchParams() opts its subtree out of prerendering and the build is perfectly
# happy to serve the fallback.
#
# If a new page deliberately scores lower than an A, prove it in the pull request
# rather than silencing this step. `npm run check:built -- --warn-only` reports
# without failing, and `--threshold=<n>` moves the bar; both exist for a reasoned
# exception, not for a red build somebody wants to merge anyway.

on:
  # EVERY branch, not just main, so work in progress is verified while it is still in
  # progress. Shipping is a separate question and is answered in deploy.yml, which
  # listens to main alone - so a branch can be pushed as often as its author likes
  # without anything reaching production, and the push doubles as the backup.
  #
  # WHY NOT main-ONLY, which is what this said before: a branch pushed without a pull
  # request open got no checks at all, so the first feedback arrived once the work was
  # finished. That is the wrong end of the change to find out from.
  #
  # WHAT IT COSTS, stated rather than discovered: a merge to main now runs these gates
  # twice, once from here and once from deploy.yml's call. That is a few minutes of CI
  # rather than a correctness problem. Excluding main here would avoid it, at the price
  # of making main's coverage depend on deploy.yml continuing to call this file - which
  # is a worse thing to depend on than a duplicated run.
  push:
  pull_request:
  workflow_dispatch:
  # Callable, so deploy.yml runs exactly these gates before anything is shipped instead
  # of keeping a second copy of them that drifts from this one.
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Check that declared values agree
        run: npm run check:values

      # The light theme made text colour context-dependent: text-white is correct
      # only on a saturated fill, and the --ink tokens only on a surface. Swapping
      # them produces dark ink on a dark fill, which nothing else in this workflow
      # can see - not tsc, and not the analyser, which reads markup rather than
      # pixels. The migration that introduced the rule got it wrong in seven
      # places, so it is checked rather than remembered.
      - name: Check that no surface ink sits on a saturated fill
        run: npm run check:colours

      - name: Run the scoring engine's tests
        run: npm run test:analyze

      - name: Run the rate limiter's tests
        run: npm run test:rate-limit

      - name: Type check
        run: npx tsc --noEmit

      # THE ADAPTER'S OWN BUILD, not plain `next build`.
      #
      # A bare `next build` proves the pages compile. It does not prove the deployment
      # adapter accepts them - and that gap shipped a real failure: the markdown twin
      # route had no Edge Runtime declaration, next-on-pages refused to produce a Pages
      # build, and the error appeared only in the Cloudflare deploy log, because
      # `npm run pages:build` could not be reproduced on the developer's Windows machine
      # at all (it shells out to bash). Running the adapter here means the next failure of
      # that shape happens in a pull request instead.
      #
      # This invokes `next build` itself, so it replaces the step rather than joining it.
      - name: Build for Cloudflare
        run: npx opennextjs-cloudflare build
        env:
          # next/font downloads Geist at build time, so this job needs network
          # access; telemetry does not need to be part of it.
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Score the built site with its own analyser
        run: npm run check:built
