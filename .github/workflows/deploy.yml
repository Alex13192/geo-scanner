name: deploy

# Ships the Worker, and only after the same gates a pull request has to pass.
#
# WHY THIS REPOSITORY DEPLOYS ITSELF RATHER THAN LETTING A DASHBOARD DO IT:
# the site used to be deployed by a Cloudflare Pages Git integration whose build command and
# output directory existed only in the Cloudflare dashboard. Nothing in this repository said
# how the site reached production - README.md still described deploying to Vercel,
# OPERATIONS.md did not mention deployment at all, and the adapter was configured nowhere.
# That is a deployment nobody can reproduce, and it is also why a build could fail in a way
# no local command reproduced. wrangler.jsonc, this file and scripts/check-live.mjs are now
# the whole recipe.
#
# WHAT IT NEEDS:
#   CLOUDFLARE_API_TOKEN   Cloudflare dashboard -> My Profile -> API Tokens ->
#                          template "Edit Cloudflare Workers"
#   CLOUDFLARE_ACCOUNT_ID  from the dashboard URL, or `npx wrangler whoami`
# Both are repository secrets. See README.md, section "Deploying".

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time, and never cancel one that is halfway through shipping.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    env:
      # secrets is not an available context in a job-level `if`, so the token is lifted into
      # the environment where the step conditions can read it.
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      # Skipped rather than failed when the token is absent: a red run on main for every push
      # would read as "broken" when the truth is "not configured yet". This step says which.
      - name: Explain the skip if the token is missing
        if: env.CF_TOKEN == ''
        run: |
          echo "::notice title=Deploy skipped::CLOUDFLARE_API_TOKEN is not set, so nothing was deployed."
          echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets."
          echo "Until then 'npm run deploy' from a development machine works, and the site"
          echo "stays on the last deployed version."

      - uses: actions/checkout@v4
        if: env.CF_TOKEN != ''

      - uses: actions/setup-node@v4
        if: env.CF_TOKEN != ''
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        if: env.CF_TOKEN != ''
        run: npm ci

      # The OpenNext build runs the Next.js build itself.
      - name: Build for Cloudflare
        if: env.CF_TOKEN != ''
        run: npx opennextjs-cloudflare build

      - name: Deploy to Cloudflare Workers
        if: env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # `wrangler deploy`, not `wrangler pages deploy` - this is a Worker now.
          command: deploy

  # The sixth gate. Every other check inspects local build output, so none of them can see
  # what the deployment actually answers - and this one asserts WHICH deployment is answering,
  # because a run against a hostname still served by the old Pages project passed every
  # content check and looked like a successful cutover.
  smoke:
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check the deployed site
        # No hostname here on purpose. It used to be an argument, which put a copy of the
        # canonical origin in this file where check:values cannot see it - and a stale copy
        # of that value is what the gate exists to prevent. With no argument, check-live
        # reads SITE_URL from lib/site.ts.
        run: node scripts/check-live.mjs
