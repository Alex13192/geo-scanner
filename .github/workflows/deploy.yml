name: deploy

# Ships the Worker, and only after the same gates a pull request has to pass.
#
# WHY THIS REPOSITORY DEPLOYS ITSELF RATHER THAN LETTING THE DASHBOARD DO IT:
# the site used to be deployed by a Cloudflare Pages Git integration whose build command
# and output directory existed only in the Cloudflare dashboard. Nothing in this
# repository said how the site reached production - README.md still described deploying to
# Vercel, OPERATIONS.md did not mention deployment at all, and the adapter was configured
# nowhere. That is a deployment nobody can reproduce, and it is also why a build could
# fail in a way no local command reproduced.
#
# Everything needed is now here: wrangler.jsonc describes the Worker, this file describes
# the pipeline, and scripts/check-live.mjs describes the acceptance test.
#
# WHAT IT NEEDS, AND WHAT HAPPENS WITHOUT IT:
#   CLOUDFLARE_API_TOKEN   an API token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the account id from the Cloudflare dashboard URL
# Both are repository secrets. Until they exist the deploy job fails with a clear wrangler
# error and nothing is shipped - which is the correct failure, not a broken deployment.
# `npm run deploy` from a development machine remains the fallback.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time, and never cancel one that is halfway through shipping.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      # The OpenNext build needs the Next.js build, which it invokes itself.
      - name: Build for Cloudflare
        run: npx opennextjs-cloudflare build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # `wrangler deploy`, not `wrangler pages deploy` - this is a Worker now.
          command: deploy

  # The sixth gate, and the only one that can run here: every other check inspects local
  # build output, so none of them can see what the deployment actually answers. This is
  # also what caught an earlier release shipping security headers that only existed in a
  # config file.
  smoke:
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check the deployed site
        run: node scripts/check-live.mjs https://geo-scanner.ccie13192.com
