name: deploy

# Ships the Worker, and only after the same gates a pull request has to pass.
#
# WHY THIS REPOSITORY DEPLOYS ITSELF RATHER THAN LETTING A DASHBOARD DO IT:
# the site used to be deployed by a Cloudflare Pages Git integration whose build command and
# output directory existed only in the Cloudflare dashboard. Nothing in this repository said
# how the site reached production - README.md still described deploying to Vercel,
# OPERATIONS.md did not mention deployment at all, and the adapter was configured nowhere.
# That is a deployment nobody can reproduce, and it is also why a build could fail in a way
# no local command reproduced. wrangler.jsonc, this file and scripts/check-live.mjs are now
# the whole recipe.
#
# WHAT IT NEEDS:
#   CLOUDFLARE_API_TOKEN   Cloudflare dashboard -> My Profile -> API Tokens ->
#                          template "Edit Cloudflare Workers"
#   CLOUDFLARE_ACCOUNT_ID  from the dashboard URL, or `npx wrangler whoami`
# Both are repository secrets. See README.md, section "Deploying".

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time, and never cancel one that is halfway through shipping.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    env:
      # secrets is not an available context in a job-level `if`, so the token is lifted into
      # the environment where the step conditions can read it.
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      # Skipped rather than failed when the token is absent: a red run on main for every push
      # would read as "broken" when the truth is "not configured yet". This step says which.
      - name: Explain the skip if the token is missing
        if: env.CF_TOKEN == ''
        run: |
          echo "::notice title=Deploy skipped::CLOUDFLARE_API_TOKEN is not set, so nothing was deployed."
          echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets."
          echo "Until then 'npm run deploy' from a development machine works, and the site"
          echo "stays on the last deployed version."

      - uses: actions/checkout@v4
        if: env.CF_TOKEN != ''

      - uses: actions/setup-node@v4
        if: env.CF_TOKEN != ''
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        if: env.CF_TOKEN != ''
        run: npm ci

      # The OpenNext build runs the Next.js build itself.
      #
      # OPERATOR_IDENTITY IS NOT MAPPED HERE, and the first attempt to map it is why. The refund page
      # was prerendered, so a build-time value would have been baked into a static file - and when the
      # build had no value, the fallback sentence shipped and no later change could reach it. That
      # page is now rendered per request and reads the Worker's environment instead, so the address
      # belongs to the Worker's configuration, not to this file:
      #
      #   npx wrangler secret put OPERATOR_IDENTITY -c wrangler.jsonc
      #
      # An address is public by design - it is printed on /refund/ - but it is not committed to a
      # public repository either: OPERATIONS.md is explicit about that, which is why it lives in the
      # deployment's environment and not in this file.
      - name: Build for Cloudflare
        if: env.CF_TOKEN != ''
        # No unsupported-version flag any more: the Next 16 migration removed the condition that
        # required it. See the note on the same command in verify.yml.
        run: npx opennextjs-cloudflare build

      - name: Deploy to Cloudflare Workers
        if: env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # `wrangler deploy`, not `wrangler pages deploy` - this is a Worker now.
          command: deploy

      # THE STEP THAT MAKES A DEPLOY VISIBLE TO SOMEBODY ELSE'S CACHE.
      #
      # On 2026-10-23 an external audit fetched the site after a deploy and reported the
      # pre-deploy homepage - old banner, old footer, no links to the pages that had just
      # shipped - while the origin was serving the new version. HTML no longer permits that
      # (next.config.ts now sends `max-age=0, must-revalidate` for every content page), but
      # public/ assets such as llms.txt and sitemap.xml are edge-cached by Cloudflare, and a
      # cache entry can outlive the deploy that changed the file. Purging once after the
      # Worker is live removes every stale copy in one call.
      #
      # CONTINUE-ON-ERROR IS DELIBERATE: the token may not carry the "Cache Purge"
      # permission (the default Workers template does not). A purge that is not authorised
      # does not mean the deploy failed, and the log has to say which of the two happened
      # rather than turning a released deploy red. The hostname is read from lib/site.ts,
      # never copied here - check:values fails on a second copy of the origin.
      - name: Purge the edge cache so the deploy is visible
        if: env.CF_TOKEN != ''
        continue-on-error: true
        run: |
          HOST=$(node -e 'const fs=require("fs");const m=fs.readFileSync("lib/site.ts","utf8").match(/SITE_URL\s*=\s*"([^"]+)"/);process.stdout.write(new URL(m[1]).host)')
          ZONE=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=$HOST" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);process.stdout.write(j.success&&j.result[0]?j.result[0].id:"")}catch{process.stdout.write("")}})')
          if [ -z "$ZONE" ]; then
            echo "::notice title=Cache purge skipped::The token cannot read the zone for $HOST. Purge it in the dashboard, or add Zone:Read and Cache Purge to CLOUDFLARE_API_TOKEN. The deploy itself succeeded."
            exit 0
          fi
          STATUS=$(curl -sS -o "$RUNNER_TEMP/purge.json" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            -d '{"purge_everything":true}' \
            "https://api.cloudflare.com/client/v4/zones/$ZONE/purge_cache")
          if [ "$STATUS" = "200" ]; then
            echo "Edge cache purged for $HOST."
          else
            echo "::warning title=Cache purge failed::HTTP $STATUS. Add Zone:Read and Cache Purge to CLOUDFLARE_API_TOKEN; the deploy itself succeeded. Public files may stay cached until they expire."
            cat "$RUNNER_TEMP/purge.json" 2>/dev/null || true
          fi

      # THE SECOND WORKER, AND THE SILENTEST FAILURE THIS REPOSITORY CAN HAVE.
      #
      # Without this step the site deploys and the weekly runner does not. Every visible
      # thing then works: /monitor/ renders, the form posts, the confirmation email arrives,
      # the subscriber is written to D1 and confirmed. No report is ever sent, because the
      # worker that sends it was never uploaded, and nothing errors anywhere. The only
      # symptom is an absence, and absences are not reported by anybody.
      #
      # Deployed separately rather than through the action above because wrangler-action takes
      # one config file, and these two workers have their own. It runs after the site on
      # purpose: a site deploy that fails should stop before touching the runner.
      #
      # RESEND_API_KEY IS NOT SET HERE and cannot be. Secrets are per-worker and are written
      # with `wrangler secret put`, so it has to be set on geo-scanner-reports once with:
      #   npx wrangler secret put RESEND_API_KEY --name geo-scanner-reports
      # It survives every subsequent deploy. A deploy without it succeeds and the consumer
      # fails on every message - scanning works, sending does not, so the log says the scan
      # was fine and the subscriber still hears nothing.
      - name: Deploy the report worker
        if: env.CF_TOKEN != ''
        run: npx wrangler deploy -c cron/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # The sixth gate. Every other check inspects local build output, so none of them can see
  # what the deployment actually answers - and this one asserts WHICH deployment is answering,
  # because a run against a hostname still served by the old Pages project passed every
  # content check and looked like a successful cutover.
  smoke:
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check the deployed site
        # No hostname here on purpose. It used to be an argument, which put a copy of the
        # canonical origin in this file where check:values cannot see it - and a stale copy
        # of that value is what the gate exists to prevent. With no argument, check-live
        # reads SITE_URL from lib/site.ts.
        run: node scripts/check-live.mjs
